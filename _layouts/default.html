<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description"
          content="{{ page.description | default: site.description }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

    <nav>

        <div class="nav-container">

            <a class="logo"
               href="{{ '/' | relative_url }}">
                SQL Pro Insights
            </a>

            <div class="nav-links">

                <a href="{{ '/' | relative_url }}">
                    Home
                </a>

                <a href="{{ '/blog/' | relative_url }}">
                    Blog
                </a>

                <a href="{{ '/#categories' | relative_url }}">
                    Categories
                </a>

                <a href="{{ '/#about' | relative_url }}">
                    About
                </a>

            </div>

        </div>

    </nav>


    <main>

        {{ content }}

    </main>


    <footer>

        <p>
            © {{ site.time | date: "%Y" }} SQL Pro Insights
        </p>

        <p>
            SQL Server • Database • Azure • AI • Automation
        </p>

    </footer>

</body>

</html>
