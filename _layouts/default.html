<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description"
          content="{{ page.description | default: site.description }}">
    {% seo %}
    
    <link rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}">
    
    <link rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

    <nav>
    <div class="nav-container">

        <a class="logo" href="{{ '/' | relative_url }}">
            SQL Pro Insights
        </a>

        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false">
            ☰
        </button>

        <div class="nav-links" id="nav-links">

            <a href="{{ '/' | relative_url }}">
                Home
            </a>

            <a href="{{ '/blog/' | relative_url }}">
                Blog
            </a>

            <a href="{{ '/categories/' | relative_url }}">
                Categories
            </a>

            <a href="{{ '/search/' | relative_url }}">
                Search
            </a>

            <a href="{{ '/about/' | relative_url }}">
                About
            </a>

            <button id="theme-toggle" class="theme-toggle" type="button">
                🌙
            </button>

        </div>

    </div>
</nav>

    <main>
        {{ content }}
    </main>

    <footer>

        <p>
            © {{ site.time | date: "%Y" }} SQL Pro Insights
        </p>

        <p>
            SQL Server • Database • Azure • AI • Automation
        </p>

    </footer>
    <script>
        const themeToggle = document.getElementById("theme-toggle");
    
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            themeToggle.textContent = "☀️";
        }
    
        themeToggle.addEventListener("click", function () {
    
            document.body.classList.toggle("dark-mode");
    
            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                themeToggle.textContent = "☀️";
            } else {
                localStorage.setItem("theme", "light");
                themeToggle.textContent = "🌙";
            }
    
        });
    </script>

    <script>
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    menuToggle.addEventListener("click", function () {

        navLinks.classList.toggle("active");

        const isOpen = navLinks.classList.contains("active");

        menuToggle.setAttribute("aria-expanded", isOpen);

        menuToggle.textContent = isOpen ? "✕" : "☰";
    });
</script>
    
</body>

</html>
