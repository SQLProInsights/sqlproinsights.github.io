---
layout: default
---

<article class="post">

    <h1>{{ page.title }}</h1>

<div class="post-meta">
    Published: {{ page.date | date: "%B %d, %Y" }}
    ·
    By <a href="{{ '/about/' | relative_url }}">Pramod Kumar Singh</a>

        {% if page.categories %}
            · {{ page.categories | join: ", " }}
        {% endif %}
    </div>

    {{ content }}

</article>
